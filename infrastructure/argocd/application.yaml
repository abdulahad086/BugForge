apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bugforge-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/abdulahad086/BugForge.git'
    targetRevision: HEAD
    path: infrastructure/kubernetes
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: bugforge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
