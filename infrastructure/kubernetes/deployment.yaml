apiVersion: v1
kind: Namespace
metadata:
  name: bugforge
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugforge-backend
  namespace: bugforge
  labels:
    app: bugforge-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bugforge-backend
  template:
    metadata:
      labels:
        app: bugforge-backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: backend
          image: ghcr.io/abdulahad086/bugforge-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: bugforge-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bugforge-backend-service
  namespace: bugforge
spec:
  type: ClusterIP
  selector:
    app: bugforge-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bugforge-config
  namespace: bugforge
data:
  PROJECT_NAME: "BugForge"
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  POSTGRES_SERVER: "bugforge-postgres-db.internal"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "bugforge_db"
  REDIS_HOST: "bugforge-redis-service"
  REDIS_PORT: "6379"
